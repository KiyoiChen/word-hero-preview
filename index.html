<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d3b">
  <meta name="description" content="單字勇者：五關夢幻冒險、二十五張精緻單字卡。收集六種屬性與隨機一至五星卡牌，每次重玩都能再聽發音、取得通關卡。">
  <title>單字勇者 · 魔法森林</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header id="toolbar"><span>單字勇者 <small>Forest 1-1</small></span><button id="fullscreen" type="button">全螢幕</button></header>
  <main id="game">
    <canvas id="canvas" aria-label="單字勇者遊戲畫面" tabindex="0"></canvas>
    <section id="welcome" aria-labelledby="game-title">
      <div class="start-card">
        <img src="icon.png" width="96" height="96" alt="勇者的劍">
        <p class="chapter">FOREST 1-1</p><h1 id="game-title">單字勇者</h1>
        <p class="intro">穿越五個夢幻世界，每關發現五個英文單字。</p>
        <button id="start" type="button">開始遊戲</button>
        <p id="loading-text" role="status" aria-live="polite">首次載入約 138 MB，建議使用 Wi-Fi。</p>
        <progress id="progress" max="100" value="0" hidden></progress>
        <p class="save-hint">進度保存在這個瀏覽器。</p>
      </div>
    </section>
    <section id="rotate" aria-label="請橫向遊玩"><div><span aria-hidden="true">▯ ↻ ▭</span><h2>把手機轉成橫向</h2><p>橫向才能清楚看到勇者與出招按鈕。</p><p id="rotate-note">轉好後，點「開始遊戲」。</p></div></section>
  </main>
  <noscript>請啟用 JavaScript 後再遊玩。</noscript>
  <script src="index.js"></script><script src="vendor/fflate-0.8.3.min.js"></script><script type="module" src="boot-1b3d6e634390.js"></script>
</body>
</html>
